<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Administrator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --navy: #1B3A5F;
      --teal: #0D7377;
      --bg: #E8EEF4;
      --card: #ffffff;
      --ink: #212121;
      --muted: #607D8B;
      --line: #D0D7DE;
      --blue: #2F6FED;
      --green: #2E9B6A;
      --purple: #6B5CE7;
      --orange: #E8913A;
      --cyan: #3BA8C4;
      --red: #E85D4C;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
    }
    .page { margin: 0 auto; padding: 16px 18px 40px; max-width: 100%; overflow-x: clip; }
    .header {
      background: linear-gradient(90deg, var(--navy), #245078);
      color: #fff;
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      margin: 0 0 14px;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      box-shadow: 0 8px 24px rgba(27,58,95,.25);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }
    .header-logo {
      height: 52px;
      width: auto;
      max-width: 160px;
      flex-shrink: 0;
      border-radius: 6px;
      display: block;
      object-fit: contain;
    }
    .header h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; }
    .header .sub {
      margin: 4px 0 0;
      opacity: .9;
      font-size: 12px;
      line-height: 1.35;
      word-break: break-word;
    }
    .header .periode {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    /* Top: 5 progress cards + panel 8 cards (2x4) seperti Dashboard.png */
    .top-metrics {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
      align-items: stretch;
    }
    @media (max-width: 1100px) {
      .top-metrics { grid-template-columns: 1fr; }
    }
    .progress-cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    @media (max-width: 1100px) {
      .progress-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .progress-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .progress-cards .kpi:first-child { grid-column: 1 / -1; }
    }
    .kpi {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 12px 10px;
      box-shadow: 0 2px 10px rgba(27,58,95,.08);
      display: flex;
      flex-direction: column;
      min-height: 118px;
      border: 1px solid #E4EAF0;
    }
    .kpi .icon {
      width: 28px; height: 28px;
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700; color: #fff;
      margin-bottom: 8px;
      background: var(--blue);
    }
    .kpi.dok .icon { background: var(--green); }
    .kpi.qa .icon { background: var(--purple); }
    .kpi.ai .icon { background: var(--orange); }
    .kpi.bast .icon { background: var(--cyan); }
    .kpi .label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    .kpi .value { font-size: 26px; font-weight: 700; color: var(--navy); margin: 4px 0 8px; line-height: 1.1; }
    .kpi .hint { font-size: 10px; color: var(--muted); margin-top: auto; }
    .kpi .pbar {
      height: 4px; background: #E8EEF4; border-radius: 99px; overflow: hidden; margin: 6px 0 4px;
    }
    .kpi .pbar > span { display: block; height: 100%; border-radius: 99px; background: var(--blue); }
    .kpi.dok .pbar > span { background: var(--green); }
    .kpi.qa .pbar > span { background: var(--purple); }
    .kpi.ai .pbar > span { background: var(--orange); }
    .kpi.bast .pbar > span { background: var(--cyan); }
    .kpi.has-tip {
      position: relative;
      cursor: help;
    }
    .kpi.has-tip::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      background: #1B3A5F;
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.35;
      padding: 8px 10px;
      border-radius: 8px;
      white-space: normal;
      width: max-content;
      max-width: 200px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(27,58,95,.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
      z-index: 20;
    }
    .kpi.has-tip::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 2px);
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #1B3A5F;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
      z-index: 20;
    }
    .kpi.has-tip:hover::after,
    .kpi.has-tip:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .kpi.has-tip:hover::before,
    .kpi.has-tip:focus-visible::before {
      opacity: 1;
    }

    /* 8 cards: 2 baris × 4 kolom dalam satu panel */
    .summary-panel {
      background: var(--card);
      border: 1px solid #D8DEE6;
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      box-shadow: 0 2px 10px rgba(27,58,95,.06);
      min-height: 118px;
    }
    @media (max-width: 700px) {
      .summary-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto;
      }
    }
    @media (max-width: 380px) {
      .summary-panel { grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; }
      .summary-cell { min-height: 64px; padding: 8px 6px; }
      .summary-cell .v { font-size: 18px; }
    }
    .summary-cell {
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      background: #fff;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 72px;
    }
    .summary-cell .k {
      font-size: 9px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .summary-cell .v {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .summary-cell.util .util-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .summary-cell.util .util-bar {
      width: 100%;
      max-width: 72px;
      height: 4px;
      background: #E8EEF4;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .summary-cell.util .util-bar > span {
      display: block; height: 100%; background: var(--green); border-radius: 99px;
    }
    .util-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: #E6F6ED; color: var(--green);
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }

    .mid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 0.85fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    @media (max-width: 1100px) {
      .mid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 10px rgba(27,58,95,.08);
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--navy);
      font-weight: 700;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .table-scroll table { min-width: 480px; }
    .mod-grid .table-scroll table { min-width: 520px; }
    .bar-wrap {
      height: 8px; background: #E8EEF4; border-radius: 99px; overflow: hidden; min-width: 60px;
    }
    .bar-fill { height: 100%; background: var(--teal); border-radius: 99px; }
    .chart-box { position: relative; height: 220px; width: 100%; }
    .chart-box.sm { height: 180px; }

    .bottom {
      display: grid;
      grid-template-columns: 1.7fr 0.7fr;
      gap: 12px;
    }
    @media (max-width: 1100px) {
      .bottom { grid-template-columns: 1fr; }
    }
    .mod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    @media (max-width: 900px) { .mod-grid { grid-template-columns: 1fr; gap: 12px; } }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge.berjalan { background: #E6F6ED; color: #1F7A4D; }
    .badge.belum { background: #EEF1F4; color: #6B7280; }
    .badge.selesai { background: #E8F0FE; color: #1A56C4; }
    .badge.tertunda { background: #FDECEA; color: #C4453A; }
    .badge.verifikasi { background: #FFF3E0; color: #B36B00; }
    .badge.lain { background: #F0ECFA; color: #5B4B9A; }

    .summary-list { list-style: none; padding: 0; margin: 0 0 12px; }
    .summary-list li {
      display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 600;
      gap: 12px;
    }
    .notes {
      background: #F7F9FC;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
    }
    .notes strong { color: var(--navy); }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      line-height: 1.45;
      word-break: break-word;
    }
    .pct { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--navy); }

    /* —— Mobile / tablet polish —— */
    @media (max-width: 900px) {
      .page { padding: 12px 12px 28px; }
      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 12px 14px;
      }
      .header-brand { gap: 10px; }
      .header-logo { height: 44px; max-width: 140px; }
      .header h1 { font-size: 18px; }
      .header .sub { font-size: 11px; }
      .header .periode {
        white-space: normal;
        align-self: stretch;
        text-align: left;
      }
      .kpi { min-height: 0; padding: 10px; }
      .kpi .value { font-size: 22px; margin: 2px 0 6px; }
      .kpi.has-tip::after {
        left: 8px;
        right: 8px;
        bottom: auto;
        top: calc(100% + 8px);
        transform: none;
        width: auto;
        max-width: none;
      }
      .kpi.has-tip::before {
        left: 24px;
        bottom: auto;
        top: calc(100% - 2px);
        border-top-color: transparent;
        border-bottom-color: #1B3A5F;
      }
      .kpi.has-tip:hover::after,
      .kpi.has-tip:focus-visible::after {
        transform: none;
      }
      .chart-box { height: 200px; }
      .chart-box.sm { height: 170px; }
      .footer { text-align: left; }
    }

    @media (max-width: 480px) {
      .page { padding: 10px 10px 24px; }
      .header-logo { height: 40px; max-width: 120px; }
      .header h1 { font-size: 16px; }
      .card { padding: 12px; border-radius: 10px; }
      .card h2 { font-size: 13px; margin-bottom: 10px; }
      .summary-cell .k { font-size: 8px; letter-spacing: .02em; }
      .summary-cell .v { font-size: 18px; }
      .kpi .label { font-size: 9px; }
      .kpi .value { font-size: 20px; }
      .kpi .hint { font-size: 9px; }
      th, td { padding: 6px 6px; font-size: 11px; }
      .mid, .bottom, .top-metrics { gap: 10px; margin-bottom: 10px; }
    }

    @media (hover: none) {
      .kpi.has-tip:focus-visible::after,
      .kpi.has-tip:focus-visible::before { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <div class="header">
      <div class="header-brand">
        <img
          class="header-logo"
          src="purecloud-logo-BW.png"
          alt="PT Purecloud Datatech Indonesia"
        />
        <div>
          <h1 id="title">Project Administrator</h1>
          <p class="sub" id="subtitle"></p>
        </div>
      </div>
      <div class="periode" id="periode"></div>
    </div>
    <div class="top-metrics" id="kpiRow"></div>
    <div class="mid">
      <div class="card">
        <h2>Progress per Komponen</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Kode</th><th>Komponen</th><th>Progress</th><th>OH</th><th>Bar</th></tr>
            </thead>
            <tbody id="kompBody"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h2>Progress per Komponen (chart)</h2>
        <div class="chart-box"><canvas id="kompChart"></canvas></div>
      </div>
      <div class="card">
        <h2>Status Deliverable</h2>
        <div class="chart-box sm"><canvas id="pieChart"></canvas></div>
      </div>
    </div>
    <div class="bottom">
      <div class="card">
        <h2>Progress per Modul</h2>
        <div class="mod-grid">
          <div class="table-scroll">
            <table>
              <thead>
                <tr><th>ID</th><th>Komp.</th><th>Modul</th><th>OH</th><th>%</th><th>Status</th></tr>
              </thead>
              <tbody id="modLeft"></tbody>
            </table>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr><th>ID</th><th>Komp.</th><th>Modul</th><th>OH</th><th>%</th><th>Status</th></tr>
              </thead>
              <tbody id="modRight"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Ringkasan Status Modul</h2>
        <ul class="summary-list" id="statusSummary"></ul>
        <div class="chart-box sm"><canvas id="donutChart"></canvas></div>
        <div class="notes" id="notes"></div>
      </div>
    </div>
    <div class="footer" id="footer"></div>
  </div>

  <script>
    function monitoringPeriode(now) {
      const end = now || new Date();
      const months = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember",
      ];
      const endLabel = end.getDate() + " " + months[end.getMonth()];
      if (end.getFullYear() === 2026) return "7 Juli – " + endLabel + " 2026";
      return "7 Juli 2026 – " + endLabel + " " + end.getFullYear();
    }

    function pct(n) {
      return (Math.round(Number(n) * 1000) / 10).toFixed(1) + "%";
    }
    function fmt(n) {
      return Number(n).toLocaleString("id-ID", { maximumFractionDigits: 0 });
    }
    const STATUS_COLOR = {
      Berjalan: "#2E9B6A",
      "Belum Mulai": "#9AA3AD",
      Selesai: "#2F6FED",
      Tertunda: "#E85D4C",
    };

    function badgeClass(status) {
      if (status === "Berjalan") return "berjalan";
      if (status === "Selesai") return "selesai";
      if (status === "Belum Mulai") return "belum";
      if (status === "Tertunda") return "tertunda";
      if (status === "Perlu Verifikasi") return "verifikasi";
      return "lain";
    }
    function utilSvg(p) {
      const r = 22, c = 2 * Math.PI * r;
      const offset = c * (1 - Math.min(1, Math.max(0, p)));
      return `<svg class="util-ring" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="#E8EEF4" stroke-width="6"/>
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="#0D7377" stroke-width="6"
          stroke-dasharray="${c}" stroke-dashoffset="${offset}"
          transform="rotate(-90 26 26)" stroke-linecap="round"/>
        <text x="26" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#1B3A5F">${pct(p)}</text>
      </svg>`;
    }

    function pbar(n, maxPct) {
      const w = Math.min(100, Math.max(0, Number(n) * 100));
      return `<div class="pbar"><span style="width:${w}%"></span></div>`;
    }

    function kpiCard(card) {
      const tip = card.tip
        ? ` tabindex="0" data-tip="${card.tip}" title="${card.tip}"`
        : "";
      return `<div class="kpi ${card.cls}"${tip}>
            <div class="icon">${card.icon}</div>
            <div class="label">${card.label}</div>
            <div class="value">${pct(card.value)}</div>
            ${pbar(card.value)}
            ${card.hint ? `<div class="hint">${card.hint}</div>` : ""}
          </div>`;
    }

    function render(data) {
      const m = data.meta;
      document.getElementById("title").textContent = m.title || "Project Administrator";
      document.getElementById("subtitle").textContent =
        m.project + "  |  " + m.vendor;
      document.getElementById("periode").innerHTML =
        "<div><b>Periode Monitoring</b></div>" + m.periode;

      const k = data.kpi;
      const d = data.deliverables;
      const oh = data.oh;
      const utilW = Math.min(100, Math.max(0, oh.utilisasi * 100));
      const progressCards = [
        { cls: "", icon: "%", label: "Progress Pekerjaan", value: k.overall },
        {
          cls: "dok has-tip",
          icon: "D",
          label: "Progress Dokumentasi",
          value: k.dokumentasi,
          hint: "7 dokumen wajib",
          tip: "Dokumen dibuat setelah modul selesai",
        },
        { cls: "qa", icon: "Q", label: "Progress QA / UAT", value: k.qaUat, hint: "Checklist Spektek" },
        { cls: "ai", icon: "AI", label: "Progress AI + Governance", value: k.ai, hint: "AI + Governance" },
        { cls: "bast", icon: "B", label: "Progress BAST", value: k.bast, hint: "Checklist serah terima" },
      ].filter((card) => card.value != null);
      document.getElementById("kpiRow").innerHTML = `
        <div class="progress-cards" style="grid-template-columns:repeat(${progressCards.length},minmax(0,1fr))">
          ${progressCards.map(kpiCard).join("")}
        </div>
        <div class="summary-panel" aria-label="Ringkasan deliverable dan OH">
          <div class="summary-cell"><div class="k">Total Deliverable</div><div class="v">${d.total}</div></div>
          <div class="summary-cell"><div class="k">Selesai</div><div class="v">${d.selesai}</div></div>
          <div class="summary-cell"><div class="k">Berjalan</div><div class="v">${d.berjalan}</div></div>
          <div class="summary-cell"><div class="k">Belum Mulai</div><div class="v">${d.belumMulai}</div></div>
          <div class="summary-cell"><div class="k">Total OH</div><div class="v">${fmt(oh.total)}</div></div>
          <div class="summary-cell"><div class="k">OH Terserap</div><div class="v">${fmt(oh.terserap)}</div></div>
          <div class="summary-cell"><div class="k">Sisa OH</div><div class="v">${fmt(oh.sisa)}</div></div>
          <div class="summary-cell util">
            <div class="k">Utilisasi OH</div>
            <div class="util-row">
              <span class="util-dot">↻</span>
              <div class="v">${pct(oh.utilisasi)}</div>
            </div>
            <div class="util-bar"><span style="width:${utilW}%"></span></div>
          </div>
        </div>
      `;

      document.getElementById("kompBody").innerHTML = data.components
        .map(
          (c) => `<tr>
          <td><b>${c.kode}</b></td>
          <td>${c.name}</td>
          <td class="pct">${pct(c.progress)}</td>
          <td>${fmt(c.ohKontraktual)}</td>
          <td><div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(100, c.progress * 100)}%"></div></div></td>
        </tr>`
        )
        .join("");

      const half = Math.ceil(data.modules.length / 2);
      const rowHtml = (mod) => `<tr>
        <td><b>${mod.id}</b></td>
        <td>${mod.komponen}</td>
        <td>${mod.name.length > 42 ? mod.name.slice(0, 40) + "…" : mod.name}</td>
        <td>${fmt(mod.oh)}</td>
        <td class="pct">${pct(mod.progress)}</td>
        <td><span class="badge ${badgeClass(mod.status)}">${mod.status || "—"}</span></td>
      </tr>`;
      document.getElementById("modLeft").innerHTML = data.modules
        .slice(0, half)
        .map(rowHtml)
        .join("");
      document.getElementById("modRight").innerHTML = data.modules
        .slice(half)
        .map(rowHtml)
        .join("");

      document.getElementById("statusSummary").innerHTML = `
        <li><span>Berjalan</span><span>${d.berjalan}</span></li>
        <li><span>Belum Mulai</span><span>${d.belumMulai}</span></li>
        <li><span>Selesai</span><span>${d.selesai}</span></li>
        <li><span>Tertunda</span><span>${d.tertunda}</span></li>
      `;

      document.getElementById("notes").innerHTML =
        "<strong>Catatan penting</strong><ul style='margin:6px 0 0;padding-left:16px'>" +
        (m.notes || []).map((n) => `<li>${n}</li>`).join("") +
        "</ul>";

      document.getElementById("footer").textContent =
        "Sumber: Google Sheet  ·  Sync: " +
        (m.exportedAt || "") +
        "  ·  Gabungan OH+Perangkat: " +
        pct(k.gabungan || 0);

      // Charts
      if (window.__paCharts) {
        window.__paCharts.forEach((c) => c.destroy());
      }
      window.__paCharts = [];

      window.__paCharts.push(new Chart(document.getElementById("kompChart"), {
        type: "bar",
        data: {
          labels: data.components.map((c) => c.kode),
          datasets: [
            {
              label: "Progress %",
              data: data.components.map((c) => +(c.progress * 100).toFixed(1)),
              backgroundColor: "#0D7377",
              borderRadius: 6,
            },
          ],
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { max: 100, ticks: { callback: (v) => v + "%" } },
          },
        },
      }));

      window.__paCharts.push(new Chart(document.getElementById("pieChart"), {
        type: "doughnut",
        data: {
          labels: data.statusPie.map((s) => s.label),
          datasets: [
            {
              data: data.statusPie.map((s) => s.value),
              backgroundColor: data.statusPie.map((s) => s.color),
              borderWidth: 0,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
          },
        },
      }));

      const berjalanPct =
        d.total > 0 ? +((d.berjalan / d.total) * 100).toFixed(1) : 0;
      window.__paCharts.push(new Chart(document.getElementById("donutChart"), {
        type: "doughnut",
        data: {
          labels: ["Berjalan", "Lain"],
          datasets: [
            {
              data: [d.berjalan, Math.max(0, d.total - d.berjalan)],
              backgroundColor: [STATUS_COLOR.Berjalan, "#E8EEF4"],
              borderWidth: 0,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "68%",
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: berjalanPct + "% Modul Berjalan",
              color: "#1B3A5F",
              font: { size: 13, weight: "700" },
            },
          },
        },
      }));
    }

    /* —— Live sync dari Google Sheet (01_Dashboard) —— */
    const SHEET_ID = "1dQVdYuAjC3k3SNLjBEp_FP-qYfOEsb8Nkcr0tMTJ5bg";
    const SHEET_GID = "452601094";
    const SHEET_CSV =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/export?format=csv&gid=" +
      SHEET_GID;

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQ) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            inQ = false;
          } else {
            cell += ch;
          }
        } else if (ch === '"') {
          inQ = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (ch === "\r") {
          /* skip */
        } else {
          cell += ch;
        }
      }
      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }
      return rows;
    }

    function toNum(v) {
      if (v == null || v === "") return 0;
      if (typeof v === "number") return v;
      const s = String(v).trim().replace(/%/g, "").replace(/,/g, "");
      const n = Number(s);
      return Number.isFinite(n) ? n : 0;
    }

    function toPct(v) {
      if (v == null || v === "") return 0;
      const s = String(v).trim();
      const n = toNum(s);
      if (s.includes("%") || n > 1) return n / 100;
      return n;
    }

    function cell(rows, r, c) {
      return (rows[r] && rows[r][c] != null ? String(rows[r][c]) : "").trim();
    }

    function moduleStatus(raw, progress) {
      const s = String(raw || "").trim();
      if (/selesai/i.test(s)) return "Selesai";
      if (/tertunda/i.test(s)) return "Tertunda";
      if (/verifikasi/i.test(s)) return "Perlu Verifikasi";
      if (/belum/i.test(s)) return "Belum Mulai";
      if (/berjalan/i.test(s)) return "Berjalan";
      if (progress >= 0.995) return "Selesai";
      if (progress <= 0) return "Belum Mulai";
      return "Berjalan";
    }

    function parseDashboardCsv(text) {
      const rows = parseCsv(text);
      // Kolom A kosong. Sheet baru: KPI di baris 5. Sheet lama: KPI di baris 7.
      const fresh = /deliverable/i.test(cell(rows, 3, 2));
      const kpiRow = fresh ? 4 : 6;
      const overall = toPct(cell(rows, kpiRow, 1));
      const dokumentasi = fresh ? null : toPct(cell(rows, kpiRow, 2));
      const qaUat = fresh ? null : toPct(cell(rows, kpiRow, 3));
      const ai = fresh ? null : toPct(cell(rows, kpiRow, 4));
      const bast = fresh ? null : toPct(cell(rows, kpiRow, 5));
      const totalDel = toNum(cell(rows, kpiRow, fresh ? 2 : 7));
      const selesai = toNum(cell(rows, kpiRow, fresh ? 3 : 8));
      const berjalan = toNum(cell(rows, kpiRow, fresh ? 4 : 9));
      const belumMulai = toNum(cell(rows, kpiRow, fresh ? 5 : 10));
      const totalOh = toNum(cell(rows, kpiRow, fresh ? 7 : 12));
      const terserap = toNum(cell(rows, kpiRow, fresh ? 8 : 13));
      const sisa = toNum(cell(rows, kpiRow, fresh ? 9 : 14));
      const utilisasi = toPct(cell(rows, kpiRow, fresh ? 10 : 15));

      const realisasi35TA = fresh ? 0 : toNum(cell(rows, 4, 2));
      const taAktif = fresh ? "—" : cell(rows, 4, 6) || "—";

      const idCol = fresh ? 5 : 7;
      const kompCol = fresh ? 6 : 8;
      const modCol = fresh ? 7 : 9;
      const ohCol = fresh ? 8 : 10;
      const progCol = fresh ? 9 : 11;
      const statusCol = fresh ? 10 : 12;
      let dataStart = 11;
      for (let r = 0; r < rows.length; r++) {
        if (cell(rows, r, 1) === "Kode") {
          dataStart = r + 1;
          break;
        }
      }

      const components = [];
      const modules = [];
      for (let r = dataStart; r < rows.length; r++) {
        const kode = cell(rows, r, 1);
        const id = cell(rows, r, idCol);
        if (/^[A-G]$/.test(kode)) {
          const progress = toPct(cell(rows, r, 3));
          const ohRaw = cell(rows, r, 4);
          components.push({
            kode,
            name: cell(rows, r, 2),
            progress,
            progressPct: Math.round(progress * 1000) / 10,
            ohKontraktual: ohRaw === "" ? null : Math.round(toNum(ohRaw)),
          });
        }
        if (id && /^[A-G]\.\d+$/i.test(id)) {
          const progress = toPct(cell(rows, r, progCol));
          const oh = toNum(cell(rows, r, ohCol));
          modules.push({
            id,
            komponen: cell(rows, r, kompCol) || id.split(".")[0],
            name: cell(rows, r, modCol),
            oh,
            progress,
            progressPct: Math.round(progress * 1000) / 10,
            status: moduleStatus(cell(rows, r, statusCol), progress),
            bobotOh: oh,
          });
        }
        if (cell(rows, r, 1).startsWith("METODE:")) break;
      }
      components.forEach((c) => {
        if (c.ohKontraktual != null) return;
        c.ohKontraktual = Math.round(
          modules
            .filter((m) => m.komponen === c.kode)
            .reduce((sum, m) => sum + m.oh, 0)
        );
      });

      const lainnya = Math.max(0, totalDel - berjalan - belumMulai);
      const subtitle = cell(rows, 2, 1);
      let project = "Satu Data Itwasum Polri T.A. 2026";
      let vendor = "PT Purecloud Datatech Indonesia";
      if (subtitle.includes("|")) {
        const parts = subtitle.split("|").map((s) => s.trim());
        project = parts[0] || project;
        vendor = (parts[1] || "").replace(/\s*Sumber:.*/i, "").trim() || vendor;
      }

      return {
        meta: {
          title: "Project Administrator",
          project,
          vendor,
          source: "Spektek 2026",
          periode: monitoringPeriode(),
          exportedAt: new Date().toISOString(),
          googleSheetId: SHEET_ID,
          notes: [
            "Data live dari Google Sheet 01_Dashboard.",
            "Item Unit/Paket (E.8, F.*) tidak memboboti overall OH.",
          ],
        },
        kpi: {
          overall,
          dokumentasi,
          qaUat,
          ai,
          bast,
          gabungan: overall,
          perangkat: (components.find((c) => c.kode === "F") || {}).progress || 0,
        },
        deliverables: {
          total: totalDel || modules.length,
          selesai,
          berjalan,
          belumMulai,
          perluVerifikasi: modules.filter((m) => m.status === "Perlu Verifikasi").length,
          tertunda: modules.filter((m) => m.status === "Tertunda").length,
          lainnya,
        },
        oh: {
          total: totalOh,
          terserap,
          sisa,
          utilisasi,
          realisasi35TA,
          taAktif,
        },
        components,
        modules,
        statusPie: [
          { label: "Berjalan", value: berjalan, color: STATUS_COLOR.Berjalan },
          { label: "Belum Mulai", value: belumMulai, color: STATUS_COLOR["Belum Mulai"] },
          { label: "Selesai", value: selesai, color: STATUS_COLOR.Selesai },
          { label: "Tertunda", value: modules.filter((m) => m.status === "Tertunda").length, color: STATUS_COLOR.Tertunda },
        ],
      };
    }

    async function loadData() {
      const statusEl = document.getElementById("footer");
      if (statusEl) statusEl.textContent = "Menyinkronkan Google Sheet…";
      try {
        const url = SHEET_CSV + "&_t=" + Date.now();
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        if (!text || text.length < 50) throw new Error("CSV kosong");
        const data = parseDashboardCsv(text);
        if (!data.components.length && !data.modules.length) {
          throw new Error("Format sheet tidak dikenali");
        }
        window.PA_DATA = data;
        render(data);
      } catch (err) {
        console.error(err);
        if (window.PA_DATA) {
          render(window.PA_DATA);
          if (statusEl) {
            statusEl.textContent =
              "Gagal sync Google Sheet (" +
              err.message +
              "). Menampilkan data lokal.";
          }
        } else {
          document.getElementById("app").innerHTML =
            "<div style='padding:28px;max-width:560px'>" +
            "<h2 style='color:#1B3A5F'>Gagal memuat data Google Sheet</h2>" +
            "<p>Pastikan spreadsheet dibagikan: <b>Anyone with the link → Viewer</b>.</p>" +
            "<p style='color:#607D8B;font-size:12px'>" +
            String(err.message || err) +
            "</p>" +
            "<p><a href='" +
            SHEET_CSV +
            "' target='_blank' rel='noopener'>Uji export CSV</a></p>" +
            "</div>";
        }
      }
    }

    loadData();
  </script>
